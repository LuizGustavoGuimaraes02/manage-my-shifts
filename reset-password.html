<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Manage My Shifts</title>
    <link rel="stylesheet" href="css/style.css">

    <script src="js/storage.js"></script>
    <script src="js/shifts.js"></script>
    <script src="js/session.js"></script>
    <script>requireGuest();</script>
</head>
<body>
    <h1 class="form-title">Reset Password</h1>

    <div id="formErrors"></div>

    <div id="warningBox" class="warning-box">
        <strong>This cannot be undone.</strong>
        Resetting your password will permanently delete your account
        and every shift you've recorded. You will need to register a
        new account afterward.
    </div>

    <form id="resetForm">
        <label for="username">Username</label>
        <input type="text" id="username" required>

        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="confirmText">
            Type <strong>DELETE</strong> to confirm
        </label>
        <input type="text" id="confirmText" autocomplete="off" required>

        <button type="submit" class="btn-danger">Delete account and reset</button>
    </form>

    <p><a href="index.html">Back to login</a></p>

    <script src="js/reset-password.js"></script>
</body>
</html>
