<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | Manage My Shifts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <script src="js/storage.js"></script>
    <script src="js/session.js"></script>
    <script src="js/nav.js"></script>
    <script>requireAuth();</script>
</head>
<body data-protected="true">
     <header class="topbar">
        <span class="logo">Manage My Shifts</span>
        <nav>
            <a href="home.html">My Shifts</a>
            <a href="add-shift.html">Add Shift</a>
            <a href="profile.html">Edit Profile</a>
        </nav>
        <div class="topbar-right">
            <span id="greeting"></span>
            <button type="button" id="navToggle" class="icon-button nav-toggle" aria-label="Menu" aria-expanded="false">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <button type="button" id="logoutButton" class="icon-button" aria-label="Log out" title="Log out">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </div>
    </header>

    <main>
        <h1 class="form-title">Edit Profile</h1>

        <div id="formErrors"></div>

        <form id="profileForm">
            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="username">Username</label>
            <input type="text" id="username" required>

            <label for="password">New password</label>
            <input type="password" id="password" placeholder="Leave blank to keep current password">

            <label for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" placeholder="Only needed if changing password">

            <label for="firstName">First name</label>
            <input type="text" id="firstName" required>

            <label for="lastName">Last name</label>
            <input type="text" id="lastName" required>

            <label for="birthDate">Birth date</label>
            <input type="date" id="birthDate" required>

            <button type="submit" class="btn-confirm">Update profile</button>
        </form>
    </main>

    <script src="js/profile.js"></script>
</body>
</html>
