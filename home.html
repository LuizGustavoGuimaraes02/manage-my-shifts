<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shifts | Manage My Shifts</title>
    <link rel="stylesheet" href="css/style.css">

    <script src="js/storage.js"></script>
    <script src="js/session.js"></script>
    <script>requireAuth();</script>
    <script src="js/shifts.js"></script>
</head>
<body data-protected="true">
    <header class="topbar">
        <span class="logo">Manage My Shifts</span>
        <nav>
            <a href="home.html">My Shifts</a>
            <a href="add-shift.html">Add Shift</a>
            <a href="profile.html">Edit Profile</a>
        </nav>
        <div class="topbar-right">
            <span id="greeting"></span>
            <button type="button" id="logoutButton" class="icon-button" aria-label="Log out" title="Log out">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </div>
    </header>

    <main>
        <div class="page-header">
            <h1>My Shifts</h1>
            <a href="add-shift.html" class="button-link">+ Add Shift</a>
        </div>

        <div id="filterBar" class="filter-bar" style="display: none;">
            <div class="filter-field">
                <label for="filterPlace">Workplace</label>
                <select id="filterPlace">
                    <option value="">All</option>
                </select>
            </div>

            <div class="filter-field">
                <label for="filterFrom">From</label>
                <input type="date" id="filterFrom">
            </div>

            <div class="filter-field">
                <label for="filterTo">To</label>
                <input type="date" id="filterTo">
            </div>

            <button type="button" id="clearFiltersButton">Clear filters</button>
        </div>

        <p id="noResultsMessage" style="display: none;">No shifts found for these filters.</p>

        <div id="emptyState" style="display: none;">
            <p>You haven't added any shifts yet.</p>
            <a href="add-shift.html" class="button-link">Add your first shift</a>
        </div>

        <div id="tableWrapper" class="table-wrapper" style="display: none;">
            <table id="shiftsTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Start</th>
                        <th>End</th>
                        <th>Hourly wage</th>
                        <th>Place</th>
                        <th>Profit</th>
                    </tr>
                </thead>
                <tbody id="shiftsTableBody">
                </tbody>
            </table>
        </div>

        <div id="bestMonth" class="best-month" style="display: none;"></div>
    </main>

    <script src="js/home.js"></script>
</body>
</html>
